services:
  - type: web
    name: agrosmart-backend
    env: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 180 --worker-class gthread
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
